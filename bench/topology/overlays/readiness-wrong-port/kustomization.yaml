# readiness-wrong-port overlay — the base shop, untouched. The fault is a
# later probe-spec patch, so pre-fault the topology must be the healthy
# baseline; the overlay only stamps which scenario deployed the objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  praxis.dev/bench-scenario: readiness-wrong-port
