# storefront — the shop's web tier. Two replicas so single-pod faults leave
# a survivor and rollout-blocking faults (a PDB, Session 2.2) have something
# to block.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
    app.kubernetes.io/part-of: praxis-bench-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/part-of: praxis-bench-shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storefront
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          # Probes are deliberate scenario surface: readiness-wrong-port
          # (Session 2.2) breaks exactly this.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Limits are deliberately tight so lowering them (oomkill) or
          # starving the node (noisy-neighbour) actually bites.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app: storefront
    app.kubernetes.io/part-of: praxis-bench-shop
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
