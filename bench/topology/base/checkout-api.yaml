# checkout-api — the service most scenarios target (the dossier's OOMKill
# case lowers ITS memory limit; the sample Incident and RemediationPlan at
# config/samples/ already name it). Two replicas: a rollout can be blocked
# mid-flight, and one pod can die while the service stays up.
#
# It also carries the ONE log-noisy sidecar of the topology (playbook
# Session 3.2 task 4, container log-noise below), so every scenario's
# pods emit real, repetitive, value-changing logs that the evidence
# collector's log templating has to earn its keep against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: praxis-bench-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        app.kubernetes.io/part-of: praxis-bench-shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # 64Mi headroom over a ~15Mi idle process: enough to run clean,
          # little enough that an overlay lowering it OOMs for real.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        # log-noise — the log-noisy sidecar. agnhost's upstream
        # logs-generator writes one klog line per request-shaped event,
        # every line differing in timestamp, counter, method, path and
        # status code, at a steady 2 lines/s (720000 lines over 100h —
        # far longer than any run, so the container never exits, never
        # restarts, never touches the restart-based predicates). At Loki
        # ingestion these are hundreds of distinct raw lines per pod; in
        # an evidence bundle they must collapse into ONE LogTemplate item
        # with a count and a single exemplar (docs/adr/ADR-007.md). Same
        # pinned image as everything else, no secrets, no probes (a
        # sidecar without probes is Ready once running), limits sized so
        # the laptop budget in the README still holds.
        - name: log-noise
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["logs-generator", "--log-lines-total=720000", "--run-duration=100h"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: praxis-bench-shop
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
