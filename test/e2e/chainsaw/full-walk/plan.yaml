apiVersion: praxis.dev/v1alpha1
kind: RemediationPlan
metadata:
  name: walk-plan
spec:
  incidentRef:
    name: walk-incident
  evidenceBundleHash: sha256:2f93413dc9e4a210dfff2f65f8c6d35dad6d2ab64c2f9977b0123e2b2845ef60
  hypothesis:
    summary: "checkout-api OOMKilled after memory limit lowered in commit a91c4e"
    confidencePercent: 86
    # The one id the fixture bundle holds; it must resolve, or the plan is
    # Rejected/CitationInvalid.
    citations:
      - ev/podstatus-01
  actions:
    - type: PatchResourceLimits
      target:
        kind: Deployment
        namespace: shop
        name: checkout-api
      patchResourceLimits:
        container: api
        memory:
          from: 256Mi
          to: 512Mi
  verification:
    predicate: >-
      rate(container_oom_events_total{namespace="shop",pod=~"checkout-api-.*"}[10m]) == 0
    window: 10m
    onFailure: Rollback
  rollback:
    strategy: RestorePreviousSpec
