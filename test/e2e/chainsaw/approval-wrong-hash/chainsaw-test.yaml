# A well-formed but wrong approval hash grants nothing: the plan lands in
# terminal Rejected with reason ApprovalInvalidated, and no approver or
# timestamp is ever recorded. The shape of a hash is not THE hash.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: approval-wrong-hash
spec:
  description: >-
    Annotating a waiting plan with a hash that is not its binding hash
    rejects the plan with reason ApprovalInvalidated.
  steps:
    - name: plan-reaches-awaiting-approval
      try:
        - apply:
            file: incident.yaml
        - script:
            content: |
              set -e
              kubectl -n "$NAMESPACE" create configmap wrong-hash-bundle --from-file=bundle.json=bundle.json
              kubectl -n "$NAMESPACE" patch incident wrong-hash-incident \
                --subresource=status --type=merge \
                -p '{"status":{"evidenceBundleRef":"wrong-hash-bundle","evidenceBundleHash":"sha256:2f93413dc9e4a210dfff2f65f8c6d35dad6d2ab64c2f9977b0123e2b2845ef60"}}'
        - apply:
            file: plan.yaml
        - assert:
            file: plan-awaiting-assert.yaml
    - name: wrong-hash-approval-rejects
      try:
        - script:
            content: |
              kubectl -n "$NAMESPACE" annotate --overwrite remediationplan wrong-hash-plan \
                "praxis.dev/approve=sha256:abababababababababababababababababababababababababababababababab" \
                "praxis.dev/approved-by=mallory"
        - assert:
            file: plan-rejected-assert.yaml
