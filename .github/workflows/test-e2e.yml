name: E2E Tests

# Manual dispatch only, deliberately.
#
# docs/00-MASTER-PLAN.md Phase 0 specifies CI as "lint, vet, test on PR and
# main. No cluster-dependent jobs yet." This suite creates a kind cluster,
# builds and loads an image, installs cert-manager and deploys the manager —
# and what it currently asserts is that the *kubebuilder scaffold* comes up.
# There is no Praxis controller behaviour for it to gate, so running it on
# every push buys minutes of CI time and no signal.
#
# Re-enable `pull_request` and `push: branches: [main]` in Phase 1, when the
# phase machine gives it something real to verify.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Pinned, not "latest": an unpinned download makes the job's behaviour a
      # function of the day it ran. This is the version docs/DEVELOPMENT.md
      # records as verified.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Run e2e tests
        run: make test-e2e
