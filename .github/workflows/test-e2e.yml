name: E2E Tests

# Manual dispatch only, deliberately.
#
# The Phase 1 cluster gate this comment once promised landed as the Chainsaw
# workflow (e2e-chainsaw.yml), which runs on every PR and push to main and
# verifies actual controller behaviour. This scaffold suite verifies
# something different — that the in-cluster deployment posture comes up
# (image build, kustomize overlay, metrics behind authn/authz) — and none of
# that changed in Phase 1, so it stays on demand. It becomes load-bearing in
# Phase 5, when ServiceAccounts, RBAC and NetworkPolicies are themselves the
# test subject; promote it to `pull_request` + `push: branches: [main]` then.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Pinned, not "latest": an unpinned download makes the job's behaviour a
      # function of the day it ran. This is the version docs/DEVELOPMENT.md
      # records as verified.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Run e2e tests
        run: make test-e2e
