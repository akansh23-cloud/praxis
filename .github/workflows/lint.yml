name: Lint

# Pull requests plus pushes to main only. Without the branch filter, a pull
# request from a branch in this repository triggers the workflow twice — once
# for the push, once for the PR — and every scratch branch burns a run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # setup-go caches the module and build caches by default, keyed on go.sum.
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint
