---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: incidents.praxis.dev
spec:
  group: praxis.dev
  names:
    kind: Incident
    listKind: IncidentList
    plural: incidents
    shortNames:
    - inc
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Incident is the trigger object for the Praxis loop: something fired, here
          is what we know, and here is the boundary inside which any remediation
          must stay.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IncidentSpec describes what fired and where remediation is
              allowed to act.
            properties:
              alertFingerprint:
                description: |-
                  AlertFingerprint carries the Alertmanager fingerprint for
                  deduplication, so one alert storm produces one Incident.
                type: string
              description:
                maxLength: 2048
                minLength: 1
                type: string
              scope:
                description: |-
                  IncidentScope declares, up front, the slice of the cluster this incident
                  is about. Every action in every plan for this incident must target inside
                  it — the simulator enforces that, which is what makes "the plan cannot
                  wander" a checkable property instead of a hope.
                properties:
                  allowNodeActions:
                    description: |-
                      AllowNodeActions permits cluster-scoped node actions (CordonNode) for
                      this incident. Node objects live outside any namespace, so they need
                      an explicit grant rather than falling through the namespace check.
                    type: boolean
                  namespaces:
                    items:
                      type: string
                    maxItems: 10
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - namespaces
                type: object
              severity:
                description: Severity follows the usual on-call ladder.
                enum:
                - Critical
                - High
                - Medium
                - Low
                type: string
              source:
                description: IncidentSource names what raised the incident.
                enum:
                - Alertmanager
                - Probe
                - Manual
                type: string
            required:
            - description
            - scope
            - severity
            - source
            type: object
          status:
            description: IncidentStatus is written by the evidence collector and plan
              controllers.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidenceBundleHash:
                description: |-
                  EvidenceBundleHash is sha256 over the canonical bundle; plans cite it
                  and approvals bind to it.
                type: string
              evidenceBundleRef:
                description: |-
                  EvidenceBundleRef names the ConfigMap holding the collected,
                  normalised, size-capped evidence bundle.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: IncidentPhase tracks an incident through the loop.
                enum:
                - Detected
                - Collecting
                - Analyzed
                - Remediating
                - Resolved
                - Closed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
